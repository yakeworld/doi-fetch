[package]
name = "doi-fetch"
version = "0.1.0"
edition = "2021"
description = "Multi-source DOI full-text PDF downloader — Rust rewrite"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["full"] }
regex = "1"
anyhow = "1"

[[bin]]
name = "doi-fetch"
path = "src/main.rs"
