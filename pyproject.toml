[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doi-fetch"
version = "1.0.0"
description = "DOI full-text PDF downloader: bban.top CDN → Sci-Hub → LibGen → Anna's Archive cascade"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "curl-cffi>=0.7",
]

[project.optional-dependencies]
proxy = ["rproxy>=0.3"]

[project.scripts]
doi-fetch = "doi_fetch.cli:main"

[project.urls]
Homepage = "https://github.com/yakeworld/doi-fetch"
Source = "https://github.com/yakeworld/doi-fetch"
